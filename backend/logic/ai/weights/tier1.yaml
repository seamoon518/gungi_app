# Tier 1: 評価関数拡張版

# ── 駒価値 ───────────────────────────────────────────────────────────────────
piece_values:
  SUI: 100000
  TAI:    800   # 縦横スライド無限
  CHU:    700   # 斜めスライド無限
  OZU:    550   # 最長射程ジャンプ
  TSU:    500   # 直線ジャンプ
  KIB:    300   # 斜め移動なし
  YAR:    350   # 前方特化
  YUM:    380   # ジャンプ面制圧
  SHO:    350   # 6方向
  SAM:    300   # 4方向（横なし）
  SHI:    280   # 斜め専門
  BOU:    200   # 移動弱い・動的評価で補完
  TOR:    250
  HYO:    100

# ── 手駒価値比率（フェーズ別、常に > 1.0） ──────────────────────────────────
# 手駒は好きな場所に打てる柔軟性を持つため盤上より常に高く評価する。
# AIが駒を打つのは、打つことで得られる利益（攻撃・守備）が手駒プレミアムを
# 上回ると判断したときのみになる。
hand_piece_ratio:
  opening: 1.20
  middle:  1.30
  endgame: 1.40

# ── ゲームフェーズ判定（盤上の総駒数） ───────────────────────────────────────
phase_thresholds:
  opening: 35   # >= 35 枚 → 序盤
  endgame: 19   # <= 19 枚 → 終盤

# ── 位置評価 ─────────────────────────────────────────────────────────────────
center_weight:     3
stack_bonus_ratio: 0     # スタック評価は evaluate_stack_structure に移管
forward_weight:    5

# ── 帥安全度 ─────────────────────────────────────────────────────────────────
sui_safety_radius:  3
sui_safety_penalty: 20

# ── スタック構造評価 ─────────────────────────────────────────────────────────
# 高さ 1/2/3 における最上段駒への係数（帥・大・中は除く）
stack_height_bonus:      [1.0, 1.15, 1.30]
stack_risk_penalty_ratio: 0   # Tier 2 以降で有効化

# ── 機動力（合法手テーブルによる近似） ───────────────────────────────────────
mobility_weight: 2

# ── 跳び駒射線評価（弩/筒/弓） ───────────────────────────────────────────────
jumping_threat_weight:     15
jumping_sui_threat_weight: 50

# ── 帅の囲い（周辺8マスの自駒厚み） ─────────────────────────────────────────
sui_fortress_weight: 10

# ── 孤立駒ペナルティ ─────────────────────────────────────────────────────────
isolated_penalty_ratio: 0.15

# ── 謀の動的価値（寝返り可能な駒価値に比例） ─────────────────────────────────
bou_defect_weight: 0.3

# ── G: 帅の逃げ場（初期値 0、Tier 2 以降で有効化） ──────────────────────────
sui_mobility_weight: 0

# ── H: 射線遮断ペナルティ（初期値 0、Tier 2 以降で有効化） ───────────────────
ray_blocking_weight: 0

# ── ぶら下がり駒ペナルティ（相手に取られる位置の駒に駒価値の ratio 分を減点）
hanging_penalty_ratio: 0.12

# ── 前線評価（最前列の自駒が1行前進するごとに加点、手駒がある場合のみ有効）
frontline_weight: 8
